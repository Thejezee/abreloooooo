<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feliz Navidad, Mi Vidita ❤️</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Simonetta:wght@400;900&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(to bottom, #87cefa, #e0f7fa);
        font-family: "Simonetta", cursive;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: 90%;
        max-width: 1100px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 50px;
        box-shadow: 0 20px 60px rgba(255, 182, 193, 0.5);
        padding: 40px;
        border: 12px double #ff69b4;
        text-align: center;
      }

      .titulo {
        font-weight: 900;
        font-size: clamp(3.5rem, 8vw, 6rem);
        color: #c62828;
        margin: 0 0 40px 0;
        cursor: pointer;
      }

      .mensaje-secreto {
        font-size: clamp(1.8rem, 5vw, 3rem);
        color: #d32f2f;
        padding: 40px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 40px;
        margin: 40px 0;
        animation: aparecer 1.5s;
      }

      .oculto {
        display: none;
      }

      @keyframes aparecer {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Fila de 4 imágenes/GIFs equilibrada */
      .fila-gifs {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 30px;
        margin: 40px 0;
        align-items: center;
      }

      .gif-celda {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 35px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(173, 216, 230, 0.5);
        transition: transform 0.3s;
      }

      .gif-celda:hover {
        transform: scale(1.1);
      }

      /* Alineación específica para bordes */
      .gif-celda.izquierda {
        justify-self: start;
        margin-left: 0;
      }

      .gif-celda.centro {
        justify-self: center;
      }

      .gif-celda.derecha {
        justify-self: end;
        margin-right: 0;
      }

      /* Imágenes y GIFs perfectos */
      .imagen-contenido {
        max-width: 100%;
        max-height: 300px;
        object-fit: contain;
        border-radius: 25px;
      }

      /* Efectos */
      #snow-canvas,
      .hearts,
      .lights {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9997;
      }

      .heart {
        position: absolute;
        font-size: 2rem;
        color: rgba(255, 105, 180, 0.7);
        animation: float 15s infinite linear;
        opacity: 0;
      }

      @keyframes float {
        0% {
          transform: translateY(100vh) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 0.8;
        }
        90% {
          opacity: 0.8;
        }
        100% {
          transform: translateY(-100px) rotate(360deg);
          opacity: 0;
        }
      }

      .light {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        animation: parpadear 1.5s infinite alternate;
      }

      @keyframes parpadear {
        from {
          opacity: 0.5;
        }
        to {
          opacity: 1;
          box-shadow: 0 0 30px currentColor;
        }
      }

      /* Responsivo en celular: apilados verticalmente */
      @media (max-width: 768px) {
        .fila-gifs {
          grid-template-columns: 1fr;
          gap: 40px;
        }

        .gif-celda.izquierda,
        .gif-celda.centro,
        .gif-celda.derecha {
          justify-self: center;
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Título interactivo (clic para mensaje secreto) -->
      <h1 class="titulo" id="titulo">Feliz Navidad mi vidita&lt;3</h1>

      <!-- Mensaje secreto romántico -->
      <div id="mensaje-secreto" class="mensaje-secreto oculto">
        <p>
          Mi vidita, eres el regalo más hermoso que la vida me dio.<br />
          Esta Navidad y siempre, te amo con todo mi corazón.<br />
          Gracias por hacer mis días mágicos y llenos de amor.<br /><br />
          ¡Te amo con todo mi vida!
        </p>
      </div>

      <!-- Fila de 4 imágenes/GIFs con mejor espacio -->
      <div class="fila-gifs">
        <!-- Izquierda al borde -->
        <div class="gif-celda izquierda">
          <img
            src="https://media.tenor.com/7g2q6O0b2vIAAAAC/cinnamoroll-sanrio.gif"
            class="imagen-contenido"
            alt="Cinnamoroll con regalo"
          />
        </div>

        <!-- Centro -->
        <div class="gif-celda centro">
          <img
            src="https://i.pinimg.com/originals/bb/cd/4a/bbcd4a8498bdfde55bfd6bf0fdbff66d.gif"
            class="imagen-contenido"
            alt="Cinnamoroll en nieve"
          />
        </div>

        <!-- Centro -->
        <div class="gif-celda centro">
          <img
            src="https://media.tenor.com/IFvGFBYfZhAAAAAj/sanrio-christmas.gif"
            class="imagen-contenido"
            alt="Cinnamoroll Merry Christmas"
          />
        </div>

        <!-- Derecha al borde -->
        <div class="gif-celda derecha">
          <img
            src="https://i.pinimg.com/736x/46/18/28/461828be5a42137c1ce1454b8183d050.jpg"
            class="imagen-contenido"
            alt="Nuestra foto ❤️"
          />
        </div>
      </div>
    </div>

    <!-- Efectos mágicos -->
    <canvas id="snow-canvas"></canvas>
    <div class="hearts"></div>
    <div class="lights"></div>

    <script>
      // Clic en título para mensaje secreto
      document.getElementById("titulo").addEventListener("click", function () {
        document.getElementById("mensaje-secreto").classList.toggle("oculto");
      });

      // Nieve cayendo
      const canvas = document.getElementById("snow-canvas");
      const ctx = canvas.getContext("2d");

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      let snowflakes = [];
      const numFlakes = 200;

      function createSnowflake() {
        return {
          x: Math.random() * canvas.width,
          y: -10,
          radius: Math.random() * 3 + 1,
          speed: Math.random() * 2 + 1,
          wind: Math.random() * 1 - 0.5,
        };
      }

      for (let i = 0; i < numFlakes; i++) {
        snowflakes.push(createSnowflake());
      }

      function drawSnow(flake) {
        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.fill();
      }

      function animateSnow() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        snowflakes.forEach((flake) => {
          drawSnow(flake);
          flake.y += flake.speed;
          flake.x += flake.wind;
          if (flake.y > canvas.height) {
            flake.y = -10;
            flake.x = Math.random() * canvas.width;
          }
        });
        requestAnimationFrame(animateSnow);
      }
      animateSnow();
    </script>
  </body>
</html>
